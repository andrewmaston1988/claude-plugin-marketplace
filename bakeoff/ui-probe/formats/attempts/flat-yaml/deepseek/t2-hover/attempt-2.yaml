id: t2-hover
task: t2-hover
backend: browser
steps:
  - viewport:
      width: 1280
      height: 900
  - open:
      url: "http://127.0.0.1:18772/detail"
  - hover:
      target: "[data-testid=rec-tile]"
  - expect_css:
      target: "[data-testid=hover-bar]"
      property: opacity
      equals: "1"
      tolerance: 0.01
  - viewport:
      width: 390
      height: 844
      touch: true
  - open:
      url: "http://127.0.0.1:18772/detail"
  - tap:
      target: "[data-testid=rec-tile]"
  - expect_css:
      target: "[data-testid=hover-bar]"
      property: opacity
      equals: "0"
      tolerance: 0.01
