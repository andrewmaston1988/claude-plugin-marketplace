<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="swarm">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>swarm</title>
<style>
  :root {
    --ground:#101219; --surface:#181b24; --surface-2:#1e222d; --ink:#e7e9f1; --muted:#9aa0b1; --faint:#6b7181; --rule:#2b3040;
    --accent:#8e7ff2; --accent-soft:#241f3d; --ok:#4fc98a; --ok-bg:#123324; --warn:#e0aa4e; --warn-bg:#33280f; --bad:#e8776a; --bad-bg:#341916;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
    --rail:56px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--mono); font-size:14px; -webkit-text-size-adjust:100%; }
  body { padding-bottom:env(safe-area-inset-bottom); overflow-x:hidden; }
  main { overflow-x:hidden; padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
  a { color:var(--accent); text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  header { position:sticky; top:0; z-index:2; background:var(--ground); border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:4px; padding:8px 8px 8px 4px; padding-top:calc(8px + env(safe-area-inset-top)); }
  header .btn { width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex:none; }
  header .title { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
  header .title b { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .title small { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header.home .title b { font-size:18px; }
  .section { display:flex; align-items:center; gap:12px; padding:16px 16px 8px; font-size:11px; line-height:1; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  .section.dim { color:var(--faint); }
  .section > span, .section small { line-height:1; display:block; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .section > span:first-child { flex:0 1 auto; }
  .section small { flex:none; }
  .section .line { min-width:24px; }
  .section.tap { min-height:44px; padding-top:12px; padding-bottom:12px; }
  .section .chev { flex:none; margin-left:4px; }
  .section .line { flex:1; height:1px; background:var(--rule); align-self:center; }
  .section small { letter-spacing:0; text-transform:none; color:var(--muted); font-size:11px; }
  header.home .title b { display:flex; align-items:baseline; gap:12px; }
  header.home .title b small { font-weight:400; font-size:12px; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; }
  .row { display:flex; align-items:stretch; min-height:44px; }
  .row .rail { width:var(--rail); flex:none; }
  .row .body { flex:1; min-width:0; padding:12px 16px 12px 0; border-bottom:1px solid var(--rule); display:flex; flex-direction:column; gap:8px; }
  .row .head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .row .name { font-size:15px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .meta { font-size:12px; color:var(--muted); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .row .sub { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; }
  .counts { display:inline-flex; align-items:center; gap:8px; vertical-align:middle; }
  .c-ok { color:var(--ok); } .c-run { color:var(--accent); } .c-warn { color:var(--warn); } .c-bad { color:var(--bad); } .c-pend { color:var(--faint); }
  .bar { display:flex; height:3px; overflow:hidden; background:var(--surface-2); }
  .bar span { display:block; }
  .tap { -webkit-tap-highlight-color:transparent; cursor:pointer; }
  .dim { color:var(--muted); }
  .faint { color:var(--faint); }
  /* run view */
  .graph { position:relative; }
  /* --rail is set per run by drawRail from the widest open wave, so lanes never
     run under the row text; the rows' spacer and the overlay share the variable. */
  .graph svg.overlay { position:absolute; left:0; top:0; width:var(--rail); pointer-events:none; overflow:visible; }
  .wave-label { padding:12px 16px 4px var(--rail); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); display:flex; gap:8px; }
  .wave-label.live { color:var(--accent); }
  .wave-label small { letter-spacing:0; text-transform:none; }
  .leaf .body { padding:8px 12px 8px 0; flex-direction:row; align-items:center; gap:8px; }
  .leaf .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .leaf .txt .name { font-size:14px; }
  .leaf .txt .meta { white-space:normal; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .leaf .right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .leaf.quiet .body { background:var(--warn-bg); }
  .leaf.quiet .txt .meta { color:var(--warn); }
  .strip { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .strip i { display:block; width:8px; height:8px; border-radius:50%; background:var(--rule); }
  .strip i.sq { border-radius:2px; }
  .strip i.ok { background:var(--ok); } .strip i.run { background:var(--accent); animation:pulse 1.6s ease-in-out infinite; } .strip i.warn { background:var(--warn); } .strip i.bad { background:var(--bad); }
  .strip .more { font-size:11px; color:var(--faint); margin-left:4px; }
  .chev { flex:none; }
  .totals { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 16px; border-bottom:1px solid var(--rule); font-size:13px; line-height:1; }
  .totals > * { line-height:1; }
  .totals .bar { width:150px; flex:none; }
  .counts, .counts > span, .meta { line-height:1; }
  .row .sub { line-height:1; }
  .row .sub .meta { line-height:1; }
  /* leaf view */
  .kv { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); padding:16px 16px; gap:8px; }
  .kv div { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .kv label { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .kv span { font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .block { display:flex; flex-direction:column; gap:8px; padding:16px 16px; }
  .block label { display:flex; justify-content:space-between; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
  .block label small { letter-spacing:0; text-transform:none; }
  .note { margin:12px 16px; padding:12px 12px; border:1px solid var(--rule); border-radius:6px; font-size:12px; color:var(--muted); }
  .note code { color:var(--ink); }
  /* performance view: one ranking list, whichever table feeds it */
  .rank .body { gap:4px; }
  .rank .head .name { font-size:14px; }
  .rank .head .val { font-size:15px; font-weight:650; white-space:nowrap; }
  .rank .head .val.none { color:var(--faint); font-weight:400; }
  .rank .bar { height:3px; background:var(--surface-2); }
  .rank .bar span { background:var(--accent); }
  .rank .bar.prov span { background:repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 7px); }
  .rank .meta .tag { color:var(--faint); }
  .chip[data-href], .chip[data-domain] { cursor:pointer; }
  .foot { padding:12px 16px 16px; font-size:12px; color:var(--faint); line-height:1.5; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px 0; }
  /* perf view switcher: one responsive SVG, same idiom as .cov svg.covgrid.
     Five labels cannot fit five equal CSS columns on a phone, and this page has
     no media queries — scaling a fixed coordinate space is how it fits a screen.
     The indicator moves by transform, never by animating x/width (D9). */
  .seg { padding:12px 16px 0; }
  .seg svg { width:100%; height:auto; display:block; }
  .seg .seg-rail { fill:var(--surface-2); stroke:var(--rule); stroke-width:1; }
  .seg .seg-ind { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; transition:transform .2s cubic-bezier(.4,0,.2,1); }
  /* aspect + domain pickers: the lists are too long for pills on a phone */
  .selrow { display:flex; gap:8px; padding:8px 16px 0; }
  /* model dashboard: four stat tiles, compressed aspect bars, widget headers that can hold a picker */
  .kv.dash4 { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .kv.dash4 span small { font-size:12px; color:var(--muted); }
  .section .secsel { margin-left:auto; text-transform:none; letter-spacing:0; }
  .section .secsel .sel { padding:4px 8px; font-size:11px; }
  .aspects { padding:4px 16px 12px; display:flex; flex-direction:column; gap:8px; }
  .arow { display:grid; grid-template-columns:96px 1fr 64px; align-items:center; gap:8px; min-height:22px; cursor:pointer; }
  .arow .alabel { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .arow .bar { height:6px; border-radius:3px; }
  .arow .bar span { background:var(--accent); border-radius:3px; }
  .arow .bar.prov span { background:repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 7px); }
  .arow .aval { font-size:12px; text-align:right; white-space:nowrap; }
  .arow .aval small { color:var(--faint); }
  .arow.none .aval { color:var(--faint); }
  .sel { flex:1; min-width:0; font:inherit; font-size:12px; color:var(--ink); background:var(--surface-2); border:1px solid var(--rule); border-radius:8px; padding:8px 12px; }
  .chip { display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); background:var(--surface-2); border-radius:999px; padding:8px 12px; }
  .chip.run { color:var(--accent); background:var(--accent-soft); }
  .chip.ok { color:var(--ok); background:var(--ok-bg); }
  .chip.bad { color:var(--bad); background:var(--bad-bg); }
  .chip.warn { color:var(--warn); background:var(--warn-bg); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }
  /* coverage grid: one responsive SVG, labels inside it, scaled to the screen */
  .cov { padding:0 12px 16px; }
  .cov svg.covgrid { width:100%; height:auto; display:block; }
  /* cost screen (mockup 922–983): provider chips, a unit note, then ranked cards —
     a hatched bar is thin evidence, an unmeasured card draws no bar at all */
  .ctabs { display:flex; gap:6px; flex-wrap:wrap; margin:14px 16px 0; }
  .ctab { height:30px; padding:0 12px; border-radius:15px; display:flex; align-items:center; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--muted); cursor:pointer; }
  .ctab.on { background:var(--accent); color:#fff; }
  .cnote { margin:14px 16px 4px; font-size:12px; line-height:1.5; color:var(--muted); }
  .card.crow { margin-top:10px; padding:13px 14px; cursor:pointer; }
  .crow .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .crow .who { display:flex; align-items:center; gap:8px; min-width:0; }
  .crow .rk { width:19px; height:19px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--surface-2); font-size:11px; font-weight:600; color:var(--muted); }
  .crow .nm { font-size:14px; overflow-wrap:anywhere; }
  .crow .val { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; flex:none; }
  .crow .cbar { margin-top:10px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .crow .cbar span { display:block; height:5px; border-radius:3px; background:var(--accent); }
  .crow .cbar.thin span { background:repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 7px); }
  .crow .sub, .cfact .sub { margin-top:9px; font-size:11.5px; line-height:1.4; color:var(--faint); }
  .crow.unm .nm, .crow.unm .val { color:var(--faint); }
  .card.cfact { padding:18px 16px; }
  .cfact b { font-size:22px; }
  /* usage screen (mockup 403–484): hero on the least headroom, then a card per provider; a dim dashed card is a window not read */
  .uhero { margin:14px 16px 0; padding:18px; border-radius:16px; background:var(--accent-soft); border:1px solid var(--rule); }
  .uhero .lbl { font-size:11px; letter-spacing:.06em; color:var(--muted); }
  .uhero .fig { margin-top:14px; display:flex; align-items:baseline; gap:9px; }
  .uhero .fig b { font-size:44px; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
  .uhero .fig span { font-size:15px; color:var(--muted); }
  .uhero .ubar { margin-top:16px; height:8px; }
  .uhero .sub, .upc .sub { margin-top:10px; font-size:11.5px; line-height:1.4; color:var(--faint); }
  .card.upc { margin-top:10px; padding:14px; }
  .card.upc.bad { border-color:var(--bad-bg); } .card.upc.warn { border-color:var(--warn-bg); }
  .upc .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .upc .nm { font-size:14.5px; }
  .upc .val { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .upc .val.bad { color:var(--bad); } .upc .val.warn { color:var(--warn); }
  .card.upc.unread { border-style:dashed; background:none; } .upc.unread .nm { color:var(--faint); }
  .ubar { margin-top:11px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .ubar span { display:block; height:100%; border-radius:3px; background:var(--accent); }
  .ubar span.warn { background:var(--warn); } .ubar span.bad { background:var(--bad); }
  /* the cost badge rides the rank row's value side, never the name */
  .valside { display:flex; align-items:center; gap:4px; }
  .cbadge { font-size:11px; flex:none; }
  .cbadge.none { color:var(--faint); }
  /* leaders: podium marks after the name — trophy, silver, bronze; the winner's row is lifted */
  .rank .row.lead { background:var(--surface-2); }
  .rank .row.lead .name { color:var(--ink); font-weight:600; }
  .rank .row.p1 .name::after { content:" 🏆"; }
  .rank .row.p2 .name::after { content:" 🥈"; }
  .rank .row.p3 .name::after { content:" 🥉"; }
  pre.out { margin:0; white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.5; color:var(--ink); max-height:60vh; overflow:auto; }
  .json { font-size:12px; line-height:1.5; max-height:70vh; overflow:auto; word-break:break-word; }
  .json dl, .json ol { margin:0; padding:0; }
  .json .jo { display:flex; flex-direction:column; gap:4px; }
  .json .jr { display:flex; gap:8px; align-items:baseline; }
  .json .jr > dt { flex:none; color:var(--accent); min-width:0; }
  .json .jr > dt::after { content:":"; color:var(--faint); }
  .json .jr > dd { margin:0; flex:1; min-width:0; }
  .json .jr.nested { flex-direction:column; gap:4px; }
  .json .jr.nested > dd { padding-left:8px; border-left:1px solid var(--rule); }
  .json .ja { list-style:none; display:flex; flex-direction:column; gap:8px; }
  .json .ja > li { border-left:2px solid var(--rule); padding-left:12px; }
  .json .ja > li::before { content:counter(item) ""; counter-increment:item; color:var(--faint); margin-right:8px; font-size:11px; }
  .json .ja { counter-reset:item; }
  .json .jv { color:var(--ink); white-space:pre-wrap; }
  .json dd > .jo, .json dd > .ja { padding-left:8px; margin-top:4px; }
  .empty { padding:24px 16px; color:var(--faint); font-size:13px; }
  .skeleton .sk { margin:10px 16px 0; height:64px; border-radius:14px; background:var(--surface); animation:pulse 1.6s ease-in-out infinite; }
  .skeleton .sk.hero { margin-top:14px; height:150px; border-radius:16px; }
  .skeleton .sk.label { width:30%; height:11px; margin-top:18px; border-radius:6px; }
  .bnav { position:fixed; left:0; right:0; bottom:0; z-index:4; display:grid; grid-template-columns:repeat(4, 1fr); background:var(--ground); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom); }
  .bnav a { height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10.5px; font-weight:600; color:var(--muted); }
  .bnav svg { width:22px; height:22px; color:var(--faint); }
  .bnav[data-on=runs] [data-tab=runs], .bnav[data-on=usage] [data-tab=usage], .bnav[data-on=perf] [data-tab=perf], .bnav[data-on=cost] [data-tab=cost] { color:var(--accent); }
  .bnav[data-on=runs] [data-tab=runs] svg, .bnav[data-on=usage] [data-tab=usage] svg, .bnav[data-on=perf] [data-tab=perf] svg, .bnav[data-on=cost] [data-tab=cost] svg { color:var(--accent); }
  .bnav a.off { opacity:.4; }
  iframe.digestframe { width:100%; height:calc(100vh - 100px); border:0; background:var(--ground); }
  /* banner — the run's one-line verdict, one tone per state. Tones are the mockup's
     literals; they are deliberately their own scale, not the --ok/--warn/--bad chips,
     because a banner is a surface and a chip is ink on one. */
  .banner { --bn-bg:#292a3d; --bn-br:#585680; --bn-ic-bg:#5d5a87; --bn-ic-fg:#b3a9ff; --bn-sub:#9e95e8;
    display:flex; align-items:center; gap:12px; margin:12px 16px; padding:12px 16px; border-radius:14px;
    background:var(--bn-bg); border:1px solid var(--bn-br); }
  .banner.ok     { --bn-bg:#1a2e2c; --bn-br:#2d644f; --bn-ic-bg:#2f6853; --bn-ic-fg:#57d69b; --bn-sub:#8faf9e; }
  .banner.slow   { --bn-bg:#302a23; --bn-br:#6a5735; --bn-ic-bg:#705b37; --bn-ic-fg:#e5b75c; --bn-sub:#b79a63; }
  .banner.bad    { --bn-bg:#36272b; --bn-br:#7c4e4b; --bn-ic-bg:#83514e; --bn-ic-fg:#eda196; --bn-sub:#c08b80; }
  .banner .ic { width:34px; height:34px; border-radius:17px; flex:none; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; background:var(--bn-ic-bg); color:var(--bn-ic-fg); }
  .banner .txt { flex:1; min-width:0; }
  .banner .t { font-size:14.5px; font-weight:600; }
  .banner .s { margin-top:4px; font-size:11.5px; color:var(--bn-sub); }
  .banner .go { flex:none; font-size:18px; color:var(--bn-ic-fg); }
  .banner.tap { min-height:44px; }
  /* A run directory never reaches `queued`; a single leaf does, while it waits on upstream. */
  .banner .ic.bare { background:none; }
  .banner.queued { --bn-bg:#262833; --bn-br:#505466; --bn-ic-bg:#50546a; --bn-ic-fg:#c7cad6; --bn-sub:#9aa0b1; }
  /* leaf page: the banner, then its chips, then one card per question the screen answers */
  .card { margin:12px 16px 0; padding:14px; border:1px solid var(--rule); border-radius:14px; background:var(--surface); }
  .card.flush { padding:0; overflow:hidden; }
  .card .cl { display:flex; align-items:center; justify-content:space-between; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
  .card .cl b { font-size:14px; letter-spacing:0; color:var(--ink); font-variant-numeric:tabular-nums; }
  .card .gr { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:12px; font-size:12px; color:var(--muted); }
  .card .gr + .gr { margin-top:8px; }
  .card .gr .k { width:44px; flex:none; font-size:11px; color:var(--faint); }
  .card .act { flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .card .fchip { padding:4px 8px; border-radius:8px; background:var(--surface-2); color:var(--ink); font-size:12.5px; }
  .card .cf { display:flex; justify-content:space-between; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--rule); font-size:11.5px; color:var(--faint); }
  .card .show { color:var(--accent); cursor:pointer; }
  .segbar { display:flex; gap:2px; height:5px; margin-top:12px; border-radius:3px; overflow:hidden; background:var(--surface-2); }
  .legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-size:11.5px; color:var(--muted); }
  .legend i { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:2px; }
  .disc { min-height:46px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; cursor:pointer; }
  .disc ~ .disc, .card .cite { border-top:1px solid var(--rule); }
  .disc small { font-size:11.5px; color:var(--faint); }
  .card .dbody { padding:0 14px 12px; }
  .card .cite { padding:12px 14px; font-size:11.5px; color:var(--faint); }
  /* The mockup draws this as a flex:none footer inside a fixed phone frame. This page
     scrolls the document instead, so the same role is `fixed` — a bar appended into the
     scrolling body is below the fold on any run with more than a few waves. */
  .actionbar { position:fixed; left:0; right:0; bottom:calc(57px + env(safe-area-inset-bottom)); z-index:3; display:flex; gap:8px;
    padding:12px 16px;
    background:var(--ground); border-top:1px solid var(--rule); }
  .actionbar .primary { flex:1; height:46px; border-radius:12px; background:var(--accent); color:var(--ground);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
  main:has(.actionbar) { padding-bottom:calc(140px + env(safe-area-inset-bottom)); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .flash { animation:pulse .8s ease-in-out 3; }
  @keyframes dash { to { stroke-dashoffset:-56; } }
  .ring { fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:14 42; animation:dash 1.4s linear infinite; }
</style>
</head>
<body>
<header id="hdr" class="home"></header>
<main id="main"></main>
<nav id="nav" class="bnav"><a href="#/" data-tab="runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.7 7.2C6.7 13.2 12 12 12 17.8M17.3 7.2C17.3 13.2 12 12 12 17.8M12 7.2v10.6"/><circle cx="6.7" cy="7.2" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="7.2" r="2" fill="currentColor" stroke="none"/><circle cx="17.3" cy="7.2" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="2.6" fill="currentColor" stroke="none"/></svg>Runs</a><a href="#/usage" data-tab="usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 5.5l-13 13"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>Usage</a><a href="#/perf" data-tab="perf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M7.5 15l3.5-4 3 2.5 5-6"/></svg>Perf</a><a href="#/cost" data-tab="cost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="10" rx="1.5"/><circle cx="12" cy="9.5" r="2.2"/><path d="M4.5 17.5h15M6.5 20.5h11"/></svg>Cost</a></nav>
<script>
(() => {
  const TOKEN = new URLSearchParams(location.search).get("t");
  const q = (p) => TOKEN ? `${p}${p.includes("?") ? "&" : "?"}t=${encodeURIComponent(TOKEN)}` : p;
  const $ = (s) => document.querySelector(s);
  const hdr = $("#hdr"), main = $("#main");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const enc = encodeURIComponent;
  // Same glyphs as the CLI roster (src/results.mjs GLYPHS); colours map the CLI's
  // stateColor onto the page's four tones (magenta→bad, dim→pend).
  // (i) skipped reads as done, matching countsHtml/barHtml/stateOfGroup, which already
  // bucket it with ok — only this map used to disagree with the aggregates above it.
  const GLYPH = { ok: "✓", skipped: "✓", failed: "✗", "failed:timeout": "✗", "failed:stopped": "✗", blocked: "⊘", "rate-limited": "⧖", quota: "⏳", retrying: "↻", running: "◐", pending: "·", aborted: "✕" };
  const CLASS = { ok: "ok", skipped: "ok", failed: "bad", "failed:timeout": "bad", "failed:stopped": "bad", blocked: "bad", "rate-limited": "warn", quota: "warn", retrying: "warn", running: "run", pending: "pend", aborted: "pend" };
  // States a leaf can still leave on its own. A run whose engine is gone (aborted)
  // or stopped (stoppedMs) has none, whatever the log last said: those
  // leaves show as aborted and nothing spins.
  const LIVE = new Set(["running", "retrying", "pending", "rate-limited", "quota"]);
  const abortCounts = (byState) => { const out = {}; for (const [s, n] of Object.entries(byState)) { const k = LIVE.has(s) ? "aborted" : s; out[k] = (out[k] || 0) + n; } return out; };
  function endRun(run) {
    if (run.finishedMs || !(run.abortedMs || run.stoppedMs)) return run;
    run.tasks = run.tasks.map((t) => (LIVE.has(t.state) ? { ...t, state: "aborted" } : t));
    run.totals.byState = abortCounts(run.totals.byState);
    return run;
  }
  const COLOR = { ok: "var(--ok)", run: "var(--accent)", warn: "var(--warn)", bad: "var(--bad)", pend: "var(--rule)" };
  const cls = (state) => CLASS[state] || "pend";

  const fmtTok = (n) => !n ? "—" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);
  const fmtDur = (ms) => { if (ms == null) return "—"; const s = Math.max(0, Math.round(ms / 1000)); const m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  // ago()/elapsed/quiet rules live once, in live.js, behind window.swarmLive — pinned
  // by tests/live.test.mjs so the page and the test share the same copy.
  const ago = (ms) => window.swarmLive.agoText(ms, Date.now());
  // Mirrors stream.mjs tokenTotal (processed total, cache reads included) — the browser cannot import it; serve.test.mjs pins the two together.
  const tokTotal = (t) => t ? (t.input || 0) + (t.output || 0) + (t.cacheCreation || 0) + (t.cacheRead || 0) : 0;
  // The server groups runs (grouping.mjs) and labels every row; the page only draws.
  // shortProject falls back to the raw key so an old payload still renders.
  // `let`: a runs build computes the next label map as a value; commitView swaps it in.
  let groupLabels = new Map();
  const shortProject = (p) => groupLabels.get(p) || p;
  const countsHtml = (byState) => {
    const n = (...ks) => ks.reduce((a, k) => a + (byState[k] || 0), 0);
    const parts = [["ok", n("ok", "skipped"), "✓"], ["run", n("running", "retrying"), "◐"], ["warn", n("rate-limited") + n("quota"), "⧖"], ["bad", n("failed", "failed:timeout", "failed:stopped", "blocked"), "✗"], ["pend", n("pending"), "·"], ["pend", n("aborted"), "✕"]];
    return `<span class="counts">${parts.filter(([, v]) => v).map(([c, v, g]) => `<span class="c-${c}">${v}${g}</span>`).join("")}</span>`;
  };
  const barHtml = (byState, total) => {
    const seg = (ks, color) => { const v = ks.reduce((a, k) => a + (byState[k] || 0), 0); return v ? `<span style="flex:${v};background:${color}"></span>` : ""; };
    const done = ["ok", "skipped", "failed", "failed:timeout", "failed:stopped", "blocked", "running", "retrying", "rate-limited", "quota"].reduce((a, k) => a + (byState[k] || 0), 0);
    return `<div class="bar">${seg(["ok", "skipped"], "var(--ok)")}${seg(["failed", "failed:timeout", "failed:stopped", "blocked"], "var(--bad)")}${seg(["running", "retrying"], "var(--accent)")}${seg(["rate-limited", "quota"], "var(--warn)")}<span style="flex:${Math.max(0, total - done)};background:transparent"></span></div>`;
  };
  const runState = (r) => { const b = r.byState || {}; if (r.stopped) return "bad"; if (b.failed || b["failed:timeout"] || b["failed:stopped"] || b.blocked) return "bad"; if (b.running || b.retrying) return "run"; if (b["rate-limited"] || b.quota) return "warn"; if (r.active) return "run"; return "ok"; };
  const dot = (c, ring) => `<svg class="rail" viewBox="0 0 56 56" width="56" height="56" preserveAspectRatio="none"><path d="M12 0v56" stroke="var(--rule)" stroke-width="2"/><circle cx="12" cy="28" r="5" fill="${COLOR[c]}"/>${ring ? '<circle class="ring" cx="12" cy="28" r="9"/>' : ""}</svg>`;

  // A hung request would hold the single in-flight route build forever.
  const FETCH_TIMEOUT_MS = 20000;
  const api = async (p) => {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), FETCH_TIMEOUT_MS);
    try {
      const r = await fetch(q(p), { cache: "no-store", signal: ac.signal });
      if (!r.ok) throw new Error(`${r.status} ${p}`);
      return await r.json();
    } catch (e) {
      if (e && e.name === "AbortError") throw new Error(`timed out after ${FETCH_TIMEOUT_MS / 1000}s: ${p}`);
      throw e;
    } finally { clearTimeout(timer); }
  };

  // Partial updates: render to markup, then patch the live DOM in place — attributes
  // and text updated, elements kept — so a rerender never recreates the spinning
  // rings (a recreated element restarts its CSS animation: the twitch). A keyed child
  // (data-key) is found by key wherever it sits, so a ring survives paths appearing
  // before it; unkeyed children match by position. A node is only moved when it is
  // out of place — a move re-inserts, which restarts the animation too. An element
  // marked data-keep keeps its children: the rail's overlay is drawn by drawRail
  // after the morph, and wiping it here would recreate every ring each tick.
  function morph(from, to) {
    if (from.nodeType === 1 && to.nodeType === 1) { // the top-level `to` is a fragment
      for (const a of [...from.attributes]) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
      for (const a of [...to.attributes]) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
      if (to.hasAttribute("data-keep")) return;
    }
    const fc = [...from.childNodes], tc = [...to.childNodes];
    const keyOf = (n) => (n.nodeType === 1 && n.getAttribute("data-key")) || "";
    const byKey = new Map();
    for (const f of fc) { const k = keyOf(f); if (k) byKey.set(k, f); }
    const used = new Set();
    const alike = (f, t) => f.nodeType === t.nodeType && (f.nodeType !== 1 || f.tagName === t.tagName);
    for (let i = 0; i < tc.length; i++) {
      const t = tc[i], k = keyOf(t);
      let f = k ? byKey.get(k) : fc[i];
      if (f && (used.has(f) || !alike(f, t) || (!k && keyOf(f)))) f = null;
      const ref = from.childNodes[i] || null;
      if (!f) { const n = t.cloneNode(true); from.insertBefore(n, ref); used.add(n); continue; }
      used.add(f);
      if (f !== ref) from.insertBefore(f, ref);
      if (f.nodeType === 3) { if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue; continue; }
      if (f.nodeType === 1) morph(f, t);
    }
    for (const f of fc) if (!used.has(f) && f.parentNode === from) from.removeChild(f);
  }
  function setHtml(el, html) { const tpl = document.createElement("template"); tpl.innerHTML = html; morph(el, tpl.content); }
  function setSvg(svg, inner) {
    const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${inner}</svg>`, "image/svg+xml");
    // Only the children are morphed: the parsed root carries none of the live svg's
    // class/size attributes, and syncing them would strip the overlay off the rail.
    const root = doc.documentElement;
    root.removeAttribute("xmlns");
    for (const a of svg.attributes) root.setAttribute(a.name, a.value);
    root.removeAttribute("data-keep"); // this IS the draw — the markup's keep flag must not block it
    morph(svg, root);
  }

  // ── views ──────────────────────────────────────────────────────────────
  const view = { name: "runs", project: null, run: null, leaf: null, node: null };
  const ui = { closedWaves: new Set(), openProjects: new Set(), expandedProjects: new Set(), perfDomain: null, pretty: false, promptOpen: false, outputOpen: false, focusId: null, focusScroll: false, costProvider: null, usageWindow: "week" };
  let lastList = null;
  // `let`: both swapped whole at commit (a build computes fresh copies as values),
  // never mutated in place — a superseded build cannot leave a half-written mark.
  let seenActive = new Map();
  // Pre-first-fetch fallback: the config.default.json literals. Overwritten by the
  // /api/runs payload's own clockMs/uiPollMs once the first fetch lands.
  const tickCfg = { clockMs: 1000, uiPollMs: 5000 };

  function setHeader(html, home) { hdr.className = home ? "home" : ""; setHtml(hdr, html); }
  const backBtn = (href) => `<a class="btn" href="${href}" aria-label="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9aa0b1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>`;
  const chev = (open) => `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7181" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${open ? "M6 15l6-6 6 6" : "M6 9l6 6 6-6"}"/></svg>`;
  const chevRight = `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7181" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;

  async function buildRuns() {
    // expandQuery is spliced INSIDE the path api() hands to q(), so the expand
    // params and the auth token both survive — concatenating after q() mangles
    // the token and 401s the whole list.
    const data = await api(`/api/runs${window.swarmLive.expandQuery(ui.expandedProjects)}`);
    // Everything the commit needs, as values — a superseded scan writes none of it.
    const cfg = { clockMs: data.clockMs || tickCfg.clockMs, uiPollMs: data.uiPollMs || tickCfg.uiPollMs };
    const { header, home, html, labels } = renderRunsHtml(data);
    return { header, home, html, state: { lastList: data, tickCfg: cfg, groupLabels: labels, grading: data.grading } };
  }
  function renderRunsHtml(data) {
    // Labels merge into a fresh map — a value the commit swaps in, never a write to
    // the committed one. A local shortProject shadows the module arrow so this
    // build's markup reads this build's labels, not the last committed set.
    const labels = new Map(groupLabels);
    const shortProject = (p) => labels.get(p) || p;
    const runs = data.runs;
    const active = runs.filter((r) => r.active);
    // Every project gets a section — the estate view — projects with a live run first,
    // ranked by that run's newest startedMs (see live.js projectOrder — stable across
    // polls, unlike mtimeMs); inside a section live rows lead, finished follow.
    for (const r of runs) { labels.set(r.project, r.groupLabel || r.project); if (r.group) labels.set(r.group, r.groupLabel || r.group); }
    const byProject = new Map();
    for (const r of runs) { const g = r.group || r.project; if (!byProject.has(g)) byProject.set(g, []); byProject.get(g).push(r); }
    // Live rows sort by startedMs (most recently dispatched on top, staying there);
    // finished rows by mtimeMs as before.
    for (const rows of byProject.values()) {
      rows.sort((a, b) => {
        if (a.active !== b.active) return a.active ? -1 : 1;
        return a.active ? b.startedMs - a.startedMs : b.mtimeMs - a.mtimeMs;
      });
    }
    const projects = window.swarmLive.projectOrder(byProject);
    // Disk total — never the capped `runs` set, or this figure inherits the
    // same falling-number defect the token figure had: a finish pushing the
    // oldest row out of its group would lower the count.
    const total = window.swarmLive.headerRunCount(data.finishedTotals || {}, active);
    const header = `<div class="title" style="padding-left:12px"><b><span>swarm</span><small>${active.length} active · ${projects.length} project${projects.length === 1 ? "" : "s"} · ${total} run${total === 1 ? "" : "s"}</small></b></div>`;
    let html = "";
    // Live band first: every running run, across all projects, on the first screen —
    // a busy project's finished stack must never hide another project's live run.
    for (const p of projects) {
      const live = byProject.get(p).filter((r) => r.active);
      if (!live.length) continue;
      html += `<div class="section"><span>${esc(shortProject(p))}</span><span class="line"></span><small>${live.length} running</small></div><ul>`;
      for (const r of live) html += runRow(r);
      html += "</ul>";
    }
    // (d) A project's finished stack is collapsed unless manually opened — opt-in,
    // the inversion of a wave's opt-out — so a long estate's live band stays in reach.
    for (const p of projects) {
      const rest = byProject.get(p).filter((r) => !r.active);
      if (!rest.length) continue;
      const open = window.swarmLive.projectOpen(p, ui.openProjects);
      const total = (data.finishedTotals || {})[p] ?? rest.length;
      html += `<div class="section dim tap" data-key="ps:${esc(p)}" data-project="${esc(p)}"><span>${esc(shortProject(p))}</span><span class="line"></span><small>${rest.length}${total > rest.length ? ` of ${total}` : ""} finished</small>${chev(open)}</div>`;
      if (open) {
        html += `<ul data-key="pl:${esc(p)}">`;
        for (const r of rest) html += runRow(r, true, labels);
        // The row is the stack's last item, and only when the cap hid something
        // (predicate in live.js). Tapping it records the group; the next fetch
        // returns that group uncapped.
        if (window.swarmLive.showAllRow(p, { open, total, shown: rest.length, expanded: ui.expandedProjects }))
          html += `<li class="row tap" data-key="expand:${esc(p)}" data-expand="${esc(p)}"><div class="rail"></div><div class="body" style="flex-direction:row;align-items:center;justify-content:space-between;gap:8px"><span class="name" style="font-size:14px;color:var(--accent)">Show all ${total}</span>${chevRight}</div></li>`;
        html += "</ul>";
      }
    }
    if (!runs.length) html = `<div class="empty">no runs under ~/.swarm/runs yet — dispatch a swarm and it appears here.</div>`;
    return { header, home: true, html, labels };
  }
  function runRow(r, done, labels = groupLabels) {
    const shortProject = (p) => labels.get(p) || p;
    const providerMeta = Object.entries(r.providerTokens || {}).filter(([provider]) => provider !== "unknown").map(([provider, tokens]) => `${provider} ${fmtTok(tokens)}`).join(" · ");
    // Navigation is a data-href picked up by one delegated listener — never an inline
    // onclick, whose quoted string a run or leaf name could break out of.
    const href = `#/run/${enc(r.project)}/${enc(r.name)}`;
    const key = esc(`${r.project}/${r.name}`);
    const elapsed = r.finishedMs ? fmtDur(r.finishedMs - r.startedMs) : r.startedMs ? window.swarmLive.elapsedText({ state: "running", startedMs: r.startedMs }, Date.now()) : "—";
    const st = runState(r);
    if (done) {
      // No summary.json and gone quiet past the recency window: the engine never
      // closed it (killed, crashed, machine slept). Say so rather than "done".
      const stale = !r.finishedMs && !r.stopped;
      const when = r.aborted ? `aborted · engine gone · ${ago(r.mtimeMs)}` : r.stopped ? `stopped · ${ago(r.mtimeMs)}` : stale ? `stale · last event ${ago(r.mtimeMs)}` : ago(r.finishedMs);
       return `<li class="row tap" data-key="${key}" data-href="${esc(href)}">${dot(r.aborted || r.stopped ? "bad" : stale ? "pend" : st)}<div class="body" style="flex-direction:row;align-items:center;gap:8px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span class="name" style="font-size:14px;color:#c9cdd8">${esc(r.name)}</span><span class="meta faint">${esc(shortProject(r.project))} · ${when} · ${countsHtml(done && !r.finishedMs ? abortCounts(r.byState) : r.byState)}${providerMeta ? ` · ${esc(providerMeta)}` : ""}${r.hasDigest ? " · digest" : ""}</span></div>${chevRight}</div></li>`;
    }
     return `<li class="row tap" data-key="${key}" data-href="${esc(href)}">${dot(st, st === "run")}<div class="body"><div class="head"><span class="name">${esc(r.name)}</span><span class="meta">${elapsed}</span></div><div class="sub">${countsHtml(r.byState)}<span class="meta">${r.leaves} leaves · ${r.waves} wave${r.waves === 1 ? "" : "s"} · ${fmtTok(r.tokens)}${providerMeta ? ` · ${esc(providerMeta)}` : ""}</span></div>${barHtml(r.byState, r.leaves)}</div></li>`;
  }

  // ── run view: rows + rail ──────────────────────────────────────────────
  // `tasks`/`waves` is the graph to draw — the whole run for the run screen, a
  // manifest node's own subgraph for the node screen (h) — never read off a `run`
  // object directly, so both callers share this one shape.
  function buildRows(tasks, waves) {
    const byId = new Map(tasks.map((t) => [t.id, t]));
    const rows = [];
    waves.forEach((ids, w) => {
      // an expanded clone container runs no session — its sessions stand in its place
      const wtasks = ids.map((id) => byId.get(id)).filter((t) => t && !(t.kind === "container" && t.expanded));
      const parents = new Map();
      const singles = [];
      for (const t of wtasks) {
        if ((t.kind === "clone" || t.kind === "child" || t.kind === "container") && byId.has(t.parent)) {
          if (!parents.has(t.parent)) parents.set(t.parent, []);
          parents.get(t.parent).push(t);
        } else singles.push(t);
      }
      const members = [];
      for (const t of singles) {
        // A forEach row is a label its clones branch from, its sessions listed clone by
        // clone beneath it; a manifest parent is a single navigable row whose members
        // render only on its node screen (#/run/<p>/<n>/node/<id>), never inline here.
        if (parents.has(t.id)) members.push({ type: t.kind === "manifest" ? "node" : "label", id: t.id, task: t, kids: parents.get(t.id) });
        else members.push({ type: "task", id: t.id, task: t });
      }
      for (const [pid, kids] of parents) if (!byId.has(pid) || !singles.find((s) => s.id === pid)) for (const k of kids) members.push({ type: "task", id: k.id, task: k });
      // (c) open unless manually closed — no big/settled override collapsing a wave.
      const open = window.swarmLive.waveOpen(w, ui.closedWaves);
      rows.push({ type: "wave", wave: w, members, open, tasks: wtasks });
      if (open) {
        for (const m of members) {
          if (m.type === "label") {
            rows.push({ type: "label", wave: w, id: m.id, task: m.task, kids: m.kids });
            for (const k of m.kids) rows.push({ type: "task", wave: w, id: k.id, task: k, block: m.id });
          } else if (m.type === "node") {
            rows.push({ type: "node", wave: w, id: m.id, task: m.task, kids: m.kids });
          } else rows.push({ type: "task", wave: w, id: m.id, task: m.task });
        }
      }
    });
    return rows;
  }
  // live.js owns the rollup, shared with the rail's line colours.
  const stateOfGroup = (kids) => window.swarmLive.stateOfGroup(kids);
  // A clone session reads `X[i] local`, the clone's id faint; the full id stays the key.
  const sessionName = (id) => { const tilde = id.lastIndexOf("~"); return tilde > 0 ? `<span class="faint">${esc(id.slice(0, tilde))}</span> ${esc(id.slice(tilde + 1))}` : esc(id); };
  const identityName = (task) => window.swarmLive?.identityLabel ? window.swarmLive.identityLabel(task) : (task?.provider && task?.model ? `${task.provider}/${task.model}` : (task?.model || ""));
  const stripHtml = (kids, sq) => {
    const max = 40;
    const dots = kids.slice(0, max).map((k) => `<i class="${sq ? "sq " : ""}${cls(k.state)}"></i>`).join("");
    return `<div class="strip">${dots}${kids.length > max ? `<span class="more">+${kids.length - max}</span>` : ""}</div>`;
  };
  const byStateOf = (tasks) => tasks.reduce((b, t) => (b[t.state] = (b[t.state] || 0) + 1, b), {});

  // The rail's running glyph — same geometry and .ring animation as dot() — sized into a banner circle.
  const SPIN = `<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="var(--accent)"/><circle class="ring" cx="12" cy="12" r="9"/></svg>`;
  const tile = (kind, icon, title, sub, href) =>
    `<div class="banner ${kind}${href ? " tap" : ""}"${href ? ` role="link" data-key="banner" data-href="${esc(href)}"` : ""}>`
    + `<span class="ic${icon === SPIN ? " bare" : ""}">${icon}</span><div class="txt"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div></div>`
    + (href ? `<span class="go">›</span>` : "") + `</div>`;

  // One run → one verdict tile, read off the run's own facts in severity order: the
  // engine is gone, then leaves failed, then it finished, then something is quiet,
  // then it is simply running. A banner without a `sub` is decoration, so every
  // branch states its reason.
  function bannerHtml(run, tasks, now, quietWarn) {
    const b = byStateOf(tasks);
    const n = (...ks) => ks.reduce((a, k) => a + (b[k] || 0), 0);
    const done = n("ok", "skipped");
    const failed = n("failed", "failed:timeout", "failed:stopped", "blocked");
    const tok = fmtTok(tasks.reduce((a, t) => a + tokTotal(t.tokens), 0));
    const dhref = (run.digestPath || run.reportPath) ? `#/run/${enc(run.project)}/${enc(run.name)}/digest` : null;

    if (run.abortedMs) return tile("bad", "✕", "Aborted — the engine is gone", `${done} of ${tasks.length} finished · ${tok} tokens`, dhref);
    if (run.stoppedMs) return tile("bad", "✗", "Stopped by hand", `${tasks.length - done} never finished · ${tok} tokens`, dhref);
    if (failed) return tile("bad", "✗", `${failed} of ${tasks.length} failed`, `${tok} tokens · ${run.finishedMs ? ago(run.finishedMs) : "still running"}`, dhref);
    if (run.finishedMs) return tile("ok", "✓", run.digestPath ? "Digest ready" : "Finished", `${done} of ${tasks.length} leaves · ${tok} tokens`, dhref);
    // The longest quiet stretch is the single most useful fact about a live run that
    // has one; below the threshold there is nothing to warn about.
    const quiet = tasks
      .map((t) => ({ t, s: window.swarmLive.quietSecs(t, now) }))
      .filter((x) => x.s != null && x.s * 1000 > quietWarn)
      .sort((a, x) => x.s - a.s)[0];
    if (quiet) return tile("slow", "!", `${quiet.t.id} has been quiet for ${fmtDur(quiet.s * 1000)}`, "longest quiet stretch of this run", null);
    // The floor. A run directory only exists once the engine has dispatched, so whatever
    // anything can read one, a leaf is running, done, failed, or the run is aborted —
    // there is no reachable run that has started nothing to give a tone of its own. A live
    // run with no leaf running (between waves, engine alive) is still a live run.
    const running = n("running", "retrying");
    return tile("", SPIN, `${running} running`, `${done} of ${tasks.length} done · ${tok} tokens`, null);
  }

  // The RUN screen's chrome: the verdict tile, then the one action that screen exists
  // for. Deliberately not part of renderRunHtml — the node screen shares that renderer
  // with a manifest node's SUBGRAPH, and a run-level verdict over one node's leaf counts
  // (finishedMs/digestPath mixed with a subset of tasks) is a lie, not a summary.
  function runChromeHtml(run, tasks) {
    let html = bannerHtml(run, tasks, Date.now(), run.quietWarnMs || 60000);
    // report.html only — the digest is already one tap away from the banner.
    if (run.reportHtmlPath)
      html += `<div class="actionbar"><a class="primary" href="#/run/${enc(run.project)}/${enc(run.name)}/report">Open report</a></div>`;
    return html;
  }

  // The graph, and only the graph. `run` is read for project/name alone (row hrefs) —
  // no verdict, no action bar, so a subgraph renders identically to a whole run.
  function renderRunHtml(run, tasks, waves) {
    const now = Date.now();
    const focus = ui.focusId;
    const inFocus = (x) => focus === x || (focus || "").startsWith(x + "~");
    if (focus) { const w = waves.findIndex((ids) => ids.some(inFocus)); if (w >= 0) ui.closedWaves.delete(w); }
    const rows = buildRows(tasks, waves);
    const quietWarn = run.quietWarnMs || 60000;
    let html = "";
    const totalsByState = byStateOf(tasks);
    const total = tasks.reduce((n, t) => n + tokTotal(t.tokens), 0);
    html += `<div class="totals">${countsHtml(totalsByState)}<span class="meta">${fmtTok(total)}</span>${barHtml(totalsByState, tasks.length)}</div>`;
    html += `<div class="graph"><svg class="overlay" id="rail" data-keep></svg><ul id="rows">`;
    for (const r of rows) {
      if (r.type === "wave") {
        const live = r.tasks.some((t) => t.state === "running" || t.state === "retrying");
        const label = r.wave === 0 ? "wave 1" : `wave ${r.wave + 1}`;
        const isDigest = r.tasks.length === 1 && r.tasks[0].kind === "digest";
        const after = [...new Set(r.tasks.flatMap((t) => t.after || []))];
        const desc = isDigest ? `after all ${after.length}` : `${r.members.length} ${r.members.length === 1 ? "node" : "in parallel"}${after.length ? ` · after ${after.length <= 2 ? after.map(esc).join(", ") : after.length + " upstream"}` : ""}`;
        if (r.open) {
          html += `<li class="wave-label${live ? " live" : ""} tap" data-wave="${r.wave}"><span>${isDigest ? "digest" : label}</span><small>· ${desc}</small></li>`;
        } else {
          const st = stateOfGroup(r.tasks);
          html += `<li class="row leaf tap" data-node="wave:${r.wave}" data-wave="${r.wave}"><div class="rail"></div><div class="body"><div class="txt"><span class="meta"><span style="letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:${live ? "var(--accent)" : "var(--faint)"}">${label}</span> · ${desc}</span>${stripHtml(r.tasks)}<span class="meta">${countsHtml(byStateOf(r.tasks))} · ${fmtTok(r.tasks.reduce((n, t) => n + tokTotal(t.tokens), 0))}</span></div>${chev(false)}</div></li>`;
        }
        continue;
      }
      if (r.type === "label") {
        // A forEach is the trunk its clones branch from: no dot and no strip (its clones
        // follow, never collapsed); tappable, for the definition driving it.
        const t = r.task;
        const clones = new Set(r.kids.map((k) => /^\[(\d+)\]/.exec(k.id.slice(t.id.length))?.[1])).size;
        const href = `#/run/${enc(run.project)}/${enc(run.name)}/leaf/${enc(t.id)}`;
        html += `<li class="row leaf tap" data-key="${esc(t.id)}" data-node="${esc(t.id)}" data-href="${esc(href)}"><div class="rail"></div><div class="body"><div class="txt"><span class="name">${esc(t.id)} <span class="meta">· forEach ×${clones}</span></span><span class="meta">${countsHtml(byStateOf(r.kids))} · ${fmtTok(r.kids.reduce((n, k) => n + tokTotal(k.tokens), 0))}</span></div>${chevRight}</div></li>`;
        continue;
      }
      if (r.type === "node") {
        // (h) a nested manifest is a graph of its own — a navigable row to its own
        // screen, never flattened inline; its dot strip is the row's own summary.
        const t = r.task;
        const href = `#/run/${enc(run.project)}/${enc(run.name)}/node/${enc(t.id)}`;
         html += `<li class="row leaf tap${focus !== t.id && inFocus(t.id) ? " flash" : ""}" data-key="${esc(t.id)}" data-node="${esc(t.id)}" data-href="${esc(href)}"><div class="rail"></div><div class="body"><div class="txt"><span class="name">${esc(t.id)} <span class="meta">· manifest · ${r.kids.length} inside</span></span>${stripHtml(r.kids, true)}<span class="meta">${countsHtml(byStateOf(r.kids))} · ${esc(identityName(t))} · ${fmtTok(r.kids.reduce((n, k) => n + tokTotal(k.tokens), 0))}</span></div>${chevRight}</div></li>`;
        continue;
      }
      const t = r.task;
      const quietSecs = window.swarmLive.quietSecs(t, now);
      const quiet = quietSecs != null && quietSecs * 1000 > quietWarn;
      const right = window.swarmLive.elapsedText(t, now) ?? t.state;
       const identity = identityName(t);
       const sub = quiet ? `quiet ${quietSecs}s · ${esc(identity)}` : t.state === "running" && t.activity ? `${esc(identity)} · ${esc(t.activity)}` : t.kind === "agentless" ? `agentless${t.after?.length ? " · after " + t.after.length : ""}` : esc(identity);
      const href = `#/run/${enc(run.project)}/${enc(run.name)}/leaf/${enc(t.id)}`;
      html += `<li class="row leaf tap${quiet ? " quiet" : ""}${focus === t.id ? " flash" : ""}" data-key="${esc(t.id)}" data-node="${esc(t.id)}" data-href="${esc(href)}"><div class="rail"></div><div class="body"><div class="txt"><span class="name${t.state === "pending" ? " dim" : ""}">${r.block ? sessionName(t.id) : esc(t.id)}</span><span class="meta">${sub}</span></div><div class="right"><span class="c-${cls(t.state)}">${GLYPH[t.state] || "?"} ${esc(right)}</span><span>${fmtTok(tokTotal(t.tokens))}</span></div></div></li>`;
    }
    html += `</ul></div>`;
    return { html, rows };
  }

  // Draw the rail as ONE overlay. live.js decides every lane and route (railRows →
  // railLayout); this only measures row centres — so lines meet at every row boundary
  // whatever the row height — and paints. A line is coloured by the rollup of what it
  // carries; a node by its own state.
  function drawRail(tasks, rows) {
    const svg = $("#rail"), list = $("#rows");
    if (!svg || !list) return;
    const live = window.swarmLive;
    const rail = live.railRows(rows);
    const layout = live.railLayout(rail);
    const pitch = live.railPitch(layout.maxLane);
    // Sized before anything is measured: rows re-measure after the width changes,
    // since the text column reflows.
    list.parentElement.style.setProperty("--rail", `${pitch.width}px`);
    const listTop = list.getBoundingClientRect().top;
    const rowEls = [...list.children];
    const cy = (i) => { const rect = rowEls[i].getBoundingClientRect(); return rect.top - listTop + rect.height / 2; };
    const statesOf = new Map(rail.map((r) => [r.key, r.states]));
    const classOf = (states) => (states.length === 1 ? cls(states[0]) : stateOfGroup(states.map((state) => ({ state }))));
    const stroke = (keys) => COLOR[classOf(keys.flatMap((k) => statesOf.get(k) || []))];
    const height = list.getBoundingClientRect().height;
    svg.setAttribute("height", height);
    svg.setAttribute("width", pitch.width);
    svg.setAttribute("viewBox", `0 0 ${pitch.width} ${height}`);
    let out = "";
    for (const s of layout.segments) {
      const x0 = pitch.x(s.lane0), x1 = pitch.x(s.lane1), y0 = cy(s.row0) + s.off0, y1 = cy(s.row1) + s.off1, ym = (y0 + y1) / 2;
      const d = x0 === x1 ? `M${x0} ${y0} L${x1} ${y1}` : `M${x0} ${y0} C${x0} ${ym} ${x1} ${ym} ${x1} ${y1}`;
      out += `<path d="${d}" stroke="${stroke(s.carries)}" stroke-width="2" fill="none"/>`;
    }
    for (const c of layout.curves) {
      const y = cy(c.row), xa = pitch.x(c.from), xb = pitch.x(c.to);
      const [ya, yb] = c.kind === "in" ? [y - 22, y] : [y, y + 22];
      out += `<path d="M${xa} ${ya} C${xa} ${yb} ${xb} ${ya} ${xb} ${yb}" stroke="${stroke(c.carries)}" stroke-width="2" fill="none"/>`;
    }
    const parentless = new Set(rail.filter((r) => !r.parents.length).map((r) => r.key));
    for (const n of layout.nodes) {
      const x = pitch.x(n.lane), y = cy(n.row);
      if (parentless.has(n.key) && y > 30) out += `<path d="M${x} ${y - 28} L${x} ${y}" stroke="var(--rule)" stroke-width="2"/>`;
    }
    for (const n of layout.nodes) {
      const states = statesOf.get(n.key);
      const c = classOf(states);
      const ring = states.length === 1 ? states[0] === "running" || states[0] === "retrying" : c === "run";
      const x = pitch.x(n.lane), y = cy(n.row), k = esc(n.key);
      out += c === "pend" ? `<circle data-key="${k}" cx="${x}" cy="${y}" r="${pitch.r}" fill="none" stroke="var(--faint)" stroke-width="2"/>` : `<circle data-key="${k}" cx="${x}" cy="${y}" r="${pitch.r}" fill="${COLOR[c]}"/>`;
      if (ring) out += `<circle class="ring" data-key="ring:${k}" cx="${x}" cy="${y}" r="${pitch.r + 4}"/>`;
    }
    setSvg(svg, out);
  }

  // Header markup is pure — rerender() calls it on every clock tick without a fetch,
  // so the elapsed/ago text moves without a network round trip.
  function runHeaderHtml(run, now) {
    const elapsed = run.finishedMs ? `done ${ago(run.finishedMs)} · ${fmtDur(run.finishedMs - run.startedMs)}` : run.abortedMs ? `aborted · engine gone · ${ago(run.abortedMs)}` : run.stoppedMs ? `stopped · ${ago(run.stoppedMs)}` : run.startedMs ? fmtDur(now - run.startedMs) : "";
    return `${backBtn("#/")}<div class="title"><b>${esc(run.name)}</b><small>${esc(run.groupLabel || shortProject(run.project))} · ${elapsed} · ${run.tasks.length} leaves · ${run.waves.length} wave${run.waves.length === 1 ? "" : "s"}</small></div>`;
  }

  let currentRun = null;
  async function buildRun(project, name) {
    const run = endRun(await api(`/api/runs/${enc(project)}/${enc(name)}`));
    const { html, rows } = renderRunHtml(run, run.tasks, run.waves);
    return { header: runHeaderHtml(run, Date.now()), html: runChromeHtml(run, run.tasks) + html, state: { currentRun: run }, draw: () => drawRail(run.tasks, rows) };
  }

  // A manifest node's own screen: the same graph renderer, fed the task's own
  // children plus itself, re-waved by each task's already-computed depth rather
  // than a route-side recomputation — topology() in runlog.mjs owns that math once.
  function nodeSubgraph(run, id) {
    const tasks = run.tasks.filter((t) => t.id === id || t.parent === id);
    const depths = [...new Set(tasks.map((t) => t.depth ?? 0))].sort((a, b) => a - b);
    const waves = depths.map((d) => tasks.filter((t) => (t.depth ?? 0) === d).map((t) => t.id));
    return { tasks, waves };
  }

  async function buildNode(project, name, id) {
    const run = endRun(await api(`/api/runs/${enc(project)}/${enc(name)}`));
    const { tasks, waves } = nodeSubgraph(run, id);
    const { html, rows } = renderRunHtml(run, tasks, waves);
    return {
      header: `${backBtn(`#/run/${enc(project)}/${enc(name)}`)}<div class="title"><b>${esc(id)}</b><small>${esc(run.groupLabel || shortProject(project))} · ${esc(name)} · ${tasks.length} node${tasks.length === 1 ? "" : "s"}</small></div>`,
      html, state: { currentRun: run }, draw: () => drawRail(tasks, rows),
    };
  }

  // Toggles are handled by the delegated listener on main; a rerender just morphs —
  // view-aware so the clock tick and the poll both land on whichever screen is open.
  //
  // The deliberate SECOND paint site (the first is commitView): the 1 s clock
  // re-renders already-fetched data, fetch-free by construction. Safe only because
  // every state it reads — view, lastList, currentRun, currentLeaf, ui — is assigned
  // in commitView alone; a build that fetched here would make this a racing renderer.
  function rerender() {
    const now = Date.now();
    if (view.name === "runs" && lastList) {
      const { header, home, html } = renderRunsHtml(lastList);
      setHeader(header, home);
      setHtml(main, html);
      return;
    }
    if (view.name === "run" && currentRun) {
      setHeader(runHeaderHtml(currentRun, now));
      const { html, rows } = renderRunHtml(currentRun, currentRun.tasks, currentRun.waves);
      setHtml(main, runChromeHtml(currentRun, currentRun.tasks) + html);
      drawRail(currentRun.tasks, rows);
      return;
    }
    if (view.name === "node" && currentRun && view.node) {
      const { tasks, waves } = nodeSubgraph(currentRun, view.node);
      const { html, rows } = renderRunHtml(currentRun, tasks, waves);
      setHtml(main, html);
      drawRail(tasks, rows);
      return;
    }
    if (view.name === "leaf" && currentRun) {
      const { header, html } = renderLeafHtml(currentRun, currentLeaf, view.leaf);
      setHeader(header);
      setHtml(main, html);
    }
  }

  let currentLeaf;
  async function buildLeaf(project, name, id) {
    const [run, leaf] = await Promise.all([api(`/api/runs/${enc(project)}/${enc(name)}`), api(`/api/runs/${enc(project)}/${enc(name)}/leaves/${enc(id)}`).catch(() => null)]);
    const { header, html } = renderLeafHtml(run, leaf, id);
    return { header, html, state: { currentRun: run, currentLeaf: leaf } };
  }

  // One leaf → one verdict tile. No chevron: the leaf IS the destination.
  function leafBannerHtml(t, leaf, now, quietSecs) {
    const tok = `${fmtTok(tokTotal(t.tokens || leaf?.tokens))} tokens`;
    const took = t.durationMs != null ? fmtDur(t.durationMs) : window.swarmLive.elapsedText(t, now) ?? "—";
    const last = t.lastEventMs ? ` · last event ${ago(t.lastEventMs)}` : "";
    const identity = identityName(t);
    switch (t.state) {
      case "ok": return tile("ok", "✓", `Finished clean in ${took}`, tok);
      case "skipped": return tile("ok", "✓", "Skipped", "its condition was false — nothing ran");
      case "failed:timeout": return tile("bad", "✗", `Timed out after ${took}`, tok + last);
      case "failed:stopped": return tile("bad", "✗", "Stopped by hand", tok + last);
      case "failed": return tile("bad", "✗", `Failed after ${took}`, tok + last);
      case "blocked": return tile("bad", "⊘", "Blocked", "an upstream leaf failed, so this never ran");
      case "aborted": return tile("bad", "✕", "Aborted — the engine is gone", tok + last);
      case "rate-limited": return tile("slow", "⧖", "Rate-limited — waiting to retry", tok);
      case "quota": return tile("slow", "⏳", "Out of quota — waiting for the window", tok);
      case "pending": {
        const after = t.after || [];
        return after.length
          ? tile("queued", "·", "Waiting on upstream", `Starts when ${after.join(", ")} finish${after.length === 1 ? "es" : ""}`)
          : tile("queued", "·", "Queued", "waiting for a free slot");
      }
    }
    if (quietSecs != null) return tile("slow", "!", `No output for ${fmtDur(quietSecs * 1000)}`, `${tok} so far`);
    return tile("", SPIN, `Running for ${took}`, `${identity ? `${identity} · ` : ""}${tok} so far`);
  }

  function renderLeafHtml(run, leaf, id) {
    const now = Date.now();
    const t = run.tasks.find((x) => x.id === id) || { id, state: "pending", after: [] };
    const feeds = run.tasks.filter((x) => (x.after || []).includes(id)).map((x) => x.id);
     const identity = identityName(t) || "agentless";
     const header = `${backBtn(`#/run/${enc(run.project)}/${enc(run.name)}`)}<div class="title"><b><span class="c-${cls(t.state)}">${GLYPH[t.state] || "?"}</span> ${esc(id)}</b><small>${esc(run.groupLabel || shortProject(run.project))} · ${esc(run.name)} · wave ${(t.depth ?? 0) + 1} · ${esc(identity)}</small></div>`;
    const quietSecsVal = window.swarmLive.quietSecs(t, now);
    const quiet = quietSecsVal != null && quietSecsVal * 1000 > (run.quietWarnMs || 60000);
    let html = leafBannerHtml(t, leaf, now, quiet ? quietSecsVal : null);
    html += `<div class="chips"><span class="chip ${cls(t.state)}">${GLYPH[t.state] || "?"} ${esc(t.state)}</span>${t.model ? `<span class="chip" data-href="#/perf/model/${enc(t.model)}">${esc(identity)}</span>` : ""}${t.kind && t.kind !== "leaf" ? `<span class="chip">${esc(t.kind)}</span>` : ""}</div>`;
    // Position in graph: what it waited on, what it unblocks, and the way back to the rail.
    const fchips = (ids, none) => ids.length ? ids.map((x) => `<span class="fchip">${esc(x)}</span>`).join("") : `<span>${none}</span>`;
    const order = run.tasks.filter((x) => x.kind !== "digest").map((x) => x.id);
    const turns = leaf?.numTurns != null ? ` · ${leaf.numTurns} turn${leaf.numTurns === 1 ? "" : "s"}` : "";
    html += `<div class="card"><div class="cl">position in graph</div>`
      + `<div class="gr"><span class="k">after</span>${fchips(t.after || [], "nothing upstream")}</div>`
      + `<div class="gr"><span class="k">feeds</span>${fchips(feeds, "—")}</div>`
      + (t.activity ? `<div class="gr"><span class="k">last</span><span class="act">${esc(t.activity)}</span></div>` : "")
      + `<div class="cf"><span>leaf ${order.indexOf(id) + 1} of ${order.length} · wave ${(t.depth ?? 0) + 1}${turns}</span><span class="show" data-focus="${esc(id)}" data-href="#/run/${enc(run.project)}/${enc(run.name)}">Show in tree ›</span></div></div>`;
    const tk = t.tokens || leaf?.tokens;
    if (tk) {
      // "input" means what the CLI means by it (results.mjs:369): input + cacheCreation.
      // On a Claude leaf the whole prompt is cache-written on turn 1, so `input` alone is
      // just the uncached tail. cacheRead is its own segment: re-read transcript, not billed.
      const billedIn = (tk.input || 0) + (tk.cacheCreation || 0), outp = tk.output || 0, cr = tk.cacheRead || 0;
      // A live Ollama tick is a running total — the whole prompt as input, no output, no cache —
      // and the split only exists in the final result. Zeros drawn from it would be a claim.
      const noSplit = LIVE.has(t.state) && !outp && !cr && !tk.cacheCreation;
      const seg = (n, colour) => `<span style="flex:${n};background:${colour}"></span>`;
      const key = (colour, label, n) => `<span><i style="background:${colour}"></i>${label} ${n ? fmtTok(n) : "0"}</span>`;
      html += `<div class="card"><div class="cl">tokens<b>${fmtTok(tokTotal(tk))}</b></div>`
        + (noSplit ? `<div class="cf"><span>running total — the input / output / cache split arrives when the leaf finishes</span></div>` : "")
        + (noSplit ? "" : `<div class="segbar">${seg(billedIn, "var(--accent)")}${seg(outp, "var(--ok)")}${seg(cr, "var(--rule)")}</div>`
          + `<div class="legend">${key("var(--accent)", "Input", billedIn)}${key("var(--ok)", "Output", outp)}${key("var(--rule)", "Cache", cr)}</div>`)
        + (!noSplit && !tk.cacheCreation && !cr ? `<div class="cf"><span>no cache buckets from this provider — every turn re-sends the transcript</span></div>` : "")
        + `</div>`;
    }
    // Prompt and output: both long crafted text, collapsed by default — this screen is read
    // for state far more often than prose. The prettify button sits inside the output row;
    // the delegated handler resolves to the button first, so it toggles format, not the row.
    const canPretty = !!leaf?.output && (typeof leaf.outputJson === "object" && leaf.outputJson !== null || !!splitJson(leaf.output));
    const toggle = canPretty ? `<button class="chip" data-pretty="1" style="padding:4px 10px">${ui.pretty ? "raw" : "prettify"}</button>` : (leaf?.output ? "" : "appears when the leaf finishes");
    html += `<div class="card flush">`;
    if (leaf?.prompt) {
      html += `<div class="disc" data-prompt="1"><span>Prompt</span><small>${leaf.authored ? "as authored · still in flight" : ""}${chev(ui.promptOpen)}</small></div>`;
      if (ui.promptOpen) html += `<div class="dbody"><pre class="out">${esc(leaf.prompt)}</pre></div>`;
    }

        : v.name === "leaf" || v.name === "node" ? [v.leaf || v.node, runHref]
          : v.name === "digest" || v.name === "report" ? [v.run, runHref]
            : [{ perf: "performance" }[v.name] || v.name, "#/"];
    const blocks = v.name === "usage" ? '<div class="sk hero"></div>' + '<div class="sk"></div>'.repeat(3)
      : v.name === "runs" ? '<div class="sk label"></div>' + '<div class="sk"></div>'.repeat(4)
        : '<div class="sk"></div>'.repeat(5);
    return {
      header: `${back ? backBtn(back) : ""}<div class="title"${back ? "" : ' style="padding-left:12px"'}><b>${esc(title)}</b><small>&nbsp;</small></div>`,
      html: `<div class="skeleton">${blocks}</div>`,
    };
  }
  async function route() {
    const seq = ++routeSeq;
    const v = viewOf(location.hash);
    pendingView = v;
    // No view: the skeleton paints the destination without committing to it.
    if (!sameView(v, view)) commitView({ ...skeletonFor(v), home: v.name === "runs", tab: TAB[v.name] || "runs" });
    try {
      const next = await buildFor(v);
      if (!guardOk(seq, routeSeq)) return;
      commitView({ ...next, view: v });
    } catch (e) {
      if (!guardOk(seq, routeSeq)) return;
      // No header in the description: an error panel overlays the current screen,
      // and the header already describes it.
      commitView({ view: v, html: `<div class="empty">${esc(e.message)}</div>` });
    }
  }
  // Event-driven callers (SSE, the poll, the toggles) share one in-flight route build
  // plus one trailing rebuild; hashchange calls route() directly — navigation never
  // queues behind a refresh. Identity until live.js loads, swapped at boot for
  // window.swarmLive.singleFlight(route).
  let requestRoute = (fn) => fn();
  // One delegated click handler for everything in main: navigation rows and the
  // wave toggle. forEach groups and manifest nodes no longer accordion — (h) split
  // them by kind instead: a group's kids are always inline, a node is a plain nav row.
  main.addEventListener("change", (e) => {
    const t = e.target;
    if (!(t instanceof HTMLSelectElement)) return;
    if (t.dataset.nav != null) { location.hash = t.value; return; }
    if (t.dataset.domainSelect != null) { ui.perfDomain = t.value || null; requestRoute(route); }
  });
  // "Show in tree": the run screen opens the leaf's wave, flashes its row and scrolls to it.
  // The flash is a render-time class, not a classList.add — each tick's morph would strip it.
  function focusLeaf(id) {
    ui.focusId = id;
    ui.focusScroll = true;
    setTimeout(() => { ui.focusId = null; rerender(); }, 2400);
  }
  main.addEventListener("click", (e) => {
    const t = e.target.closest("[data-href], [data-wave], [data-pretty], [data-project], [data-domain], [data-prompt], [data-output], [data-expand], [data-cost-provider], [data-usage-window]");
    if (!t || !main.contains(t)) return;
    if (t.dataset.costProvider != null) { ui.costProvider = t.dataset.costProvider; requestRoute(route); return; }
    if (t.dataset.usageWindow != null) { ui.usageWindow = t.dataset.usageWindow; requestRoute(route); return; }
    if (t.dataset.prompt != null) { ui.promptOpen = !ui.promptOpen; requestRoute(route); return; }
    if (t.dataset.output != null) { ui.outputOpen = !ui.outputOpen; requestRoute(route); return; }
    if (t.dataset.pretty) { ui.pretty = !ui.pretty; requestRoute(route); return; }
    if (t.dataset.domain != null) { ui.perfDomain = t.dataset.domain || null; requestRoute(route); return; }
    // Show all: record the group — the next /api/runs fetch carries it as expand=
    // and the server returns it uncapped.
    if (t.dataset.expand != null) { ui.expandedProjects.add(t.dataset.expand); requestRoute(route); return; }
    // (d) opt-in: a project's finished stack starts closed, ui.openProjects records who was opened.
    // Collapsing also drops the expansion, so reopening starts capped again — a stale
    // expansion could otherwise keep a 300-row payload on every poll.
    if (t.dataset.project) { const p = t.dataset.project; if (ui.openProjects.has(p)) { ui.openProjects.delete(p); ui.expandedProjects.delete(p); } else ui.openProjects.add(p); requestRoute(route); return; }
    if (t.dataset.href) { if (t.dataset.focus) focusLeaf(t.dataset.focus); location.hash = t.dataset.href; return; }
    if (t.dataset.wave != null) {
      const w = Number(t.dataset.wave);
      const isOpen = t.classList.contains("wave-label");
      if (isOpen) ui.closedWaves.add(w); else ui.closedWaves.delete(w);
      rerender(); return;
    }
  });
  window.addEventListener("hashchange", route);

  // ── live ────────────────────────────────────────────────────────────────
  let es;
  let esAttempt = 0;
  function connect() {
    es = new EventSource(q("/events"));
    // pendingView as well as view: a refresh for a screen still being navigated to
    // must not be dropped because its commit has not landed (and vice versa).
    // The list view no longer reacts here — it refreshes on `runs` only (below),
    // the estate snapshot changing; a per-run `run` event still drives whichever
    // run view has that run open.
    es.addEventListener("run", (e) => {
      let d = {}; try { d = JSON.parse(e.data); } catch {}
      const v = pendingView || view;
      if (v.project === d.project && v.run === d.name) requestRoute(route);
    });
    es.addEventListener("runs", () => { if ((pendingView || view).name === "runs") requestRoute(route); });
    // D6: reconnect only once the browser has given up (readyState CLOSED) —
    // the CONNECTING case is its own retry already in flight. `esAttempt` resets
    // on a successful open; on() fetches a catch-up route so events missed
    // during the gap are not silently lost.
    es.onopen = () => { if (esAttempt) requestRoute(route); esAttempt = 0; };
    es.onerror = () => {
      if (es.readyState !== EventSource.CLOSED) return;
      es.close();
      setTimeout(connect, window.swarmLive.reconnectDelay(esAttempt++));
    };
  }
  window.addEventListener("resize", () => { if (view.name === "run" && currentRun) rerender(); });

  // One cached promise per path — script tags are loaded once and reused. This is
  // its own copy of live.js's loadScript, not a call through window.swarmLive: the
  // very first call here loads live.js itself, so it cannot depend on that global
  // existing yet (the chicken-and-egg live.js's own comment calls out). Same
  // reject-on-error contract as the copy pinned by tests/live.test.mjs's L7.
  const scriptPromises = new Map();
  function loadScript(path) {
    if (!scriptPromises.has(path)) scriptPromises.set(path, new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = path;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error(`failed to load ${path}`));
      document.head.appendChild(s);
    }));
    return scriptPromises.get(path);
  }
  // perf.js is loaded lazily, awaited only by the three new Performance kinds —
  // runs/leaf/node views never touch it, and its own onerror is swallowed on
  // purpose: a missing perf.js degrades that one screen, it does not sink boot.
  function loadPerfJs() {
    return loadScript(q("/perf.js")).catch(() => {});
  }

  // tickCfg starts at the config.default.json literals (declared with the other
  // module state above) and is overwritten by the /api/runs payload's own
  // clockMs/uiPollMs once the first fetch lands — see buildRuns().
  function startTimers() {
    setInterval(rerender, tickCfg.clockMs);
    // Running rows still need a refetch to notice a run that went quiet server-side
    // (nothing writes run.log when the engine dies) — shouldPoll gates that refetch
    // to views with something to poll, so a finished run stops hitting the network.
    setInterval(() => { if (window.swarmLive.shouldPoll(pendingView || view, currentRun, Date.now())) requestRoute(route); }, tickCfg.uiPollMs);
    // The estate scan, which that refetch cannot stand in for: on a run view it re-requests the run's OWN route.
    setInterval(() => { api("/api/runs").then((d) => announceFinished(d.runs)).catch(() => {}); }, tickCfg.uiPollMs);
  }

  // Test seam for tests/page-route.test.mjs: the vm harness has no browser, so the
  // page hands it the two functions it must drive and its committed state to read —
  // the same pattern as window.swarmLive.
  // Test seam, not a public surface: page-route.test.mjs drives route()/commitView

  // through this. Nothing in the page may read it.

  window.__swarmPage = {
    route, rerender,
    snapshot: () => ({ view: { ...view }, lastList, currentRun, currentLeaf, seenActive, groupLabels: Object.fromEntries(groupLabels), tickCfg: { ...tickCfg }, routeSeq, pendingView }),
  };

  // live.js is a hard dependency of buildRows/renderRunHtml — unlike perf.js, a
  // failed load must not route into a TypeError; it renders the empty panel instead.
  loadScript("/live.js").then(() => {
    requestRoute = window.swarmLive.singleFlight(route);
    route(); connect(); startTimers();
  }).catch((e) => {
    commitView({ html: `<div class="empty">${esc(e.message)}</div>` });
  });
})();
</script>
</body>
</html>
