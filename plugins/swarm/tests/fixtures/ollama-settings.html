<!DOCTYPE html>
<html lang="en">
<head><title>ollama — settings</title></head>
<body>
  <main data-usage-track="true">
    <h1>Usage</h1>
    <section class="usage-bar" data-bar="session">
      <div class="meter" aria-label="Session usage 12% used" role="progressbar" style="width:12%"></div>
      <span class="local-time" data-time="2026-09-06T04:10:00.377393+00:00">Resets in 3 hours.</span>
    </section>
    <section class="usage-bar" data-bar="weekly">
      <div class="meter" aria-label="Weekly usage 83.8% used" role="progressbar" style="width:83.8%"></div>
      <span class="local-time" data-time="2026-09-12T08:00:00.377418+00:00">Resets in 6 days.</span>
      <div class="model-segments">
        <span data-usage-segment data-model="glm-5.3:cloud" data-requests="12" style="width:40%"></span>
        <span data-usage-segment data-model="minimax:cloud" data-requests="8" style="width:20%"></span>
      </div>
    </section>
    <div class="extra-balance">Balance remaining: $3.20</div>
  </main>
</body>
</html>
