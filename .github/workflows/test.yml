name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  file-size:
    name: file-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet reads its baseline from git, so it needs the base
          # commit present. A shallow clone makes the diff fail, and a failed
          # diff is exit 2 (fail closed), never a silent pass.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 500-line growth ratchet
        # `pull_request` and `push` both supply a base. `before` is all zeros on
        # a branch's first push -- the checker reports that as no comparable
        # base and exits 0. Neither field present (e.g. workflow_dispatch)
        # yields an empty ref, which the checker fails closed on (exit 2).
        run: node scripts/check-file-size.mjs --against "${{ github.event.pull_request.base.sha || github.event.before }}"

  checkpoint:
    name: checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node --test plugins/checkpoint/hooks/tests/*.test.mjs

  slack-bridge:
    name: slack-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test plugins/slack-bridge/tests/*.test.mjs

  claude-peers:
    name: claude-peers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node --test plugins/claude-peers/tests/*.test.mjs

  swarm:
    name: swarm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # worktree tests shell out to git and commit — CI has no default identity
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run tests
        run: node --test plugins/swarm/tests/*.test.mjs

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/pipeline/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: plugins/pipeline
      - name: Core tests
        working-directory: plugins/pipeline
        run: |
          FILES=$(ls tests/*.mjs | grep -v parity-runner)
          node --env-file=.env.test --test $FILES
      - name: Parity tests
        working-directory: plugins/pipeline
        run: node --env-file=.env.test --test tests/parity-runner.mjs
      - name: Script tests
        working-directory: plugins/pipeline
        run: node --test src/hooks/*.test.mjs src/db/*.test.mjs skills/merge/scripts/*.test.mjs
