name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  file-size:
    name: file-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet reads its baseline from git, so it needs the base
          # commit present. A shallow clone makes the diff fail, and a failed
          # diff is exit 2 (fail closed), never a silent pass.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 500-line bar
        # `pull_request` and `push` both supply a base. `before` is all zeros on
        # a branch's first push -- the checker reports that as no comparable
        # base and exits 0. Neither field present (e.g. workflow_dispatch)
        # yields an empty ref, which the checker fails closed on (exit 2).
        run: node scripts/check-file-size.mjs --against "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Orphan test files
        # A test file no suite runs is a green CI that proves nothing.
        run: node scripts/test.mjs --orphans

  # Every test job below runs the runner, so CI and a local `node
  # scripts/test.mjs --suite <name>` execute the same commands. The suites and
  # their commands live in scripts/test-suites.mjs; only CI-only steps -- git
  # identity, the read-only home sentinels, the file-type check -- stay here.

  checkpoint:
    name: checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs its base commit, which a shallow clone lacks.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        # A PR runs the suite only when the diff selects it; a push to master
        # always runs it whole.
        run: node scripts/test.mjs --suite checkpoint ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}

  slack-bridge:
    name: slack-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node scripts/test.mjs --suite slack-bridge ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}

  claude-peers:
    name: claude-peers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node scripts/test.mjs --suite claude-peers ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}

  swarm:
    name: swarm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # worktree tests shell out to git and commit — CI has no default identity
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # Read-only, not just hashed: a test that overwrites a real file and writes
      # it back leaves a snapshot unchanged, but it cannot restore a file it was
      # denied permission to write. The config is valid so a leak fails here
      # rather than on config validation. Both homes the helper redirects are
      # watched.
      - name: Plant read-only home sentinels
        run: |
          mkdir -p ~/.swarm/worktrees/sentinel ~/.claude
          printf '{"concurrency":3}\n' > ~/.swarm/config.json
          printf 'keep\n' > ~/.swarm/worktrees/sentinel/keep
          printf 'keep\n' > ~/.claude/sentinel
          chmod -R a-w ~/.swarm ~/.claude
          find ~/.swarm ~/.claude -printf '%y %m %p\n' | sort > "$RUNNER_TEMP/sentinel-listing"
          find ~/.swarm ~/.claude \( -type f -o -type l \) -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/sentinel-hashes"
      # Every test file imports tests/helpers/isolate-home.mjs first, so the
      # suite resolves the throwaway home whether the runner or a person starts
      # it. The suite's cwd (plugins/swarm) comes from the registry.
      - name: Run tests
        run: node scripts/test.mjs --suite swarm ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}
      - name: Verify home sentinels untouched
        if: always()
        run: |
          find ~/.swarm ~/.claude -printf '%y %m %p\n' | sort > "$RUNNER_TEMP/after-listing"
          find ~/.swarm ~/.claude \( -type f -o -type l \) -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/after-hashes"
          rc=0
          diff -u "$RUNNER_TEMP/sentinel-listing" "$RUNNER_TEMP/after-listing" || rc=1
          diff -u "$RUNNER_TEMP/sentinel-hashes" "$RUNNER_TEMP/after-hashes" || rc=1
          exit $rc

  ui-probe:
    name: ui-probe
    runs-on: ubuntu-latest
    env:
      UI_PROBE_REQUIRE_BROWSER: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check plugin file types
        run: |
          unexpected=$(find plugins/ui-probe/ -type f ! -name '*.mjs' ! -name '*.md' ! -name '*.json' -print)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected plugin files:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Run tests
        run: node scripts/test.mjs --suite ui-probe ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/pipeline/package-lock.json
      # Suite runs carry `install: npm ci`, hash-gated, so there is no separate
      # install step here.
      # Read-only, not just hashed: a write-and-restore leaves a snapshot
      # unchanged but cannot restore a file it was denied. Proves no writes.
      # Every redirected home is planted, plus ~/.claude, which the hooks write.
      - name: Plant read-only pipeline home sentinels
        run: |
          mkdir -p ~/.pipeline ~/.config/pipeline ~/.local/share/pipeline ~/.local/state/pipeline ~/.claude
          printf '{"proxy":{"url":"http://sentinel.invalid:1","auth_token":"sentinel"}}\n' > ~/.pipeline/config.json
          cp ~/.pipeline/config.json ~/.config/pipeline/config.json
          printf '{"status":"sentinel","pid":1}\n' > ~/.pipeline/orchestrator.state.json
          cp ~/.pipeline/orchestrator.state.json ~/.local/state/pipeline/orchestrator.state.json
          printf 'keep\n' > ~/.local/share/pipeline/sentinel
          printf 'keep\n' > ~/.local/state/pipeline/sentinel
          printf 'keep\n' > ~/.claude/sentinel
          chmod -R a-w ~/.pipeline ~/.config/pipeline ~/.local/share/pipeline ~/.local/state/pipeline ~/.claude
          find ~/.pipeline ~/.config/pipeline ~/.local/share/pipeline ~/.local/state/pipeline ~/.claude -printf '%y %m %p\n' | sort > "$RUNNER_TEMP/pipeline-sentinel-listing"
          find ~/.pipeline ~/.config/pipeline ~/.local/share/pipeline ~/.local/state/pipeline ~/.claude \( -type f -o -type l \) -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/pipeline-sentinel-hashes"
      - name: Run tests
        run: node scripts/test.mjs --suite pipeline ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}
      - name: Verify pipeline home sentinels untouched
        if: always()
        run: |
          find ~/.pipeline ~/.config/pipeline ~/.local/share/pipeline ~/.local/state/pipeline ~/.claude -printf '%y %m %p\n' | sort > "$RUNNER_TEMP/after-listing"
          find ~/.pipeline ~/.config/pipeline ~/.local/share/pipeline ~/.local/state/pipeline ~/.claude \( -type f -o -type l \) -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/after-hashes"
          rc=0
          diff -u "$RUNNER_TEMP/pipeline-sentinel-listing" "$RUNNER_TEMP/after-listing" || rc=1
          diff -u "$RUNNER_TEMP/pipeline-sentinel-hashes" "$RUNNER_TEMP/after-hashes" || rc=1
          exit $rc

  agent-investigation:
    name: agent-investigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node scripts/test.mjs --suite agent-investigation ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}

  discipline:
    name: discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node scripts/test.mjs --suite discipline ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}

  repo:
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node scripts/test.mjs --suite repo ${{ github.event_name == 'pull_request' && format('--if-selected --against {0}', github.event.pull_request.base.sha) || '' }}
