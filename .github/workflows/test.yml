name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  file-size:
    name: file-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet reads its baseline from git, so it needs the base
          # commit present. A shallow clone makes the diff fail, and a failed
          # diff is exit 2 (fail closed), never a silent pass.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 500-line growth ratchet
        # `pull_request` and `push` both supply a base. `before` is all zeros on
        # a branch's first push -- the checker reports that as no comparable
        # base and exits 0. Neither field present (e.g. workflow_dispatch)
        # yields an empty ref, which the checker fails closed on (exit 2).
        run: node scripts/check-file-size.mjs --against "${{ github.event.pull_request.base.sha || github.event.before }}"

  checkpoint:
    name: checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node --test plugins/checkpoint/hooks/tests/*.test.mjs

  slack-bridge:
    name: slack-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test plugins/slack-bridge/tests/*.test.mjs plugins/slack-bridge/tests/*/*.test.mjs

  claude-peers:
    name: claude-peers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node --test plugins/claude-peers/tests/*.test.mjs

  swarm:
    name: swarm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # worktree tests shell out to git and commit — CI has no default identity
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # Read-only, not just hashed: a test that overwrites a real file and writes
      # it back leaves a snapshot unchanged, but it cannot restore a file it was
      # denied permission to write. The config is valid so a leak fails here
      # rather than on config validation. Both homes the helper redirects are
      # watched.
      - name: Plant read-only home sentinels
        run: |
          mkdir -p ~/.swarm/worktrees/sentinel ~/.claude
          printf '{"concurrency":3}\n' > ~/.swarm/config.json
          printf 'keep\n' > ~/.swarm/worktrees/sentinel/keep
          printf 'keep\n' > ~/.claude/sentinel
          chmod -R a-w ~/.swarm ~/.claude
          find ~/.swarm ~/.claude -printf '%y %m %p\n' | sort > "$RUNNER_TEMP/sentinel-listing"
          find ~/.swarm ~/.claude \( -type f -o -type l \) -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/sentinel-hashes"
      # Every test file imports tests/helpers/isolate-home.mjs first, so the suite
      # resolves the throwaway home whether it is run by npm or by hand.
      - name: Run tests
        run: npm test
        working-directory: plugins/swarm
      - name: Verify home sentinels untouched
        if: always()
        run: |
          find ~/.swarm ~/.claude -printf '%y %m %p\n' | sort > "$RUNNER_TEMP/after-listing"
          find ~/.swarm ~/.claude \( -type f -o -type l \) -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/after-hashes"
          rc=0
          diff -u "$RUNNER_TEMP/sentinel-listing" "$RUNNER_TEMP/after-listing" || rc=1
          diff -u "$RUNNER_TEMP/sentinel-hashes" "$RUNNER_TEMP/after-hashes" || rc=1
          exit $rc

  ui-probe:
    name: ui-probe
    runs-on: ubuntu-latest
    env:
      UI_PROBE_REQUIRE_BROWSER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check plugin file types
        run: |
          unexpected=$(find plugins/ui-probe/ -type f ! -name '*.mjs' ! -name '*.md' ! -name '*.json' -print)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected plugin files:\n%s\n' "$unexpected"
            exit 1
          fi
      - name: Run tests
        run: node --test plugins/ui-probe/tests/*.test.mjs

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/pipeline/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: plugins/pipeline
      - name: Core tests
        working-directory: plugins/pipeline
        run: |
          FILES=$(ls tests/*.mjs | grep -v parity-runner)
          node --env-file=.env.test --test $FILES
      - name: Parity tests
        working-directory: plugins/pipeline
        run: node --env-file=.env.test --test tests/parity-runner.mjs
      - name: Script tests
        working-directory: plugins/pipeline
        run: node --test src/hooks/*.test.mjs src/db/*.test.mjs skills/merge/scripts/*.test.mjs
